schema: spec-driven
project: ttfx
artifact_store: openspec
execution_mode: auto
strict_tdd: true

delivery:
  strategy: single-pr
  review_budget_lines: 10000

context: |
  Tech stack: Rust 2021 CLI and animation engine; planned Swift 6.2 package for macOS 14+ and iOS 17+.
  Architecture: Rust library and CLI organized into engine, effects, and utilities, with parity and golden-test harnesses.
  Testing: Cargo unit/integration tests, Python and shell behavior suites, Linux-only byte-parity suites, and a runnable Swift Testing package.
  Style: Existing Rust conventions; technical artifacts and new source documentation use English.

testing:
  strict_tdd: true
  detected: 2026-08-14
  runners:
    rust:
      framework: cargo-test
      command: cargo test
      available: true
    swift:
      framework: swift-testing
      command: swift test
      available: true
      limitation: ""
  layers:
    unit:
      available: true
      tools: Cargo test; Swift Testing (`swift test`)
    integration:
      available: true
      tools: Cargo integration tests; Swift Testing runtime integration; shell and Python behavior suites
    e2e:
      available: true
      tools: ./bin/test; Linux-only parity and TTY comparison suites
  coverage:
    available: false
    command: ""
  quality:
    formatter:
      available: true
      command: cargo fmt --all -- --check
      current_status: failing
    linter:
      available: true
      command: cargo clippy --all-targets --all-features -- -D warnings
      current_status: failing
    type_checker:
      available: true
      command: cargo check --all-targets
    swift_formatter:
      available: false
      command: ""
    swift_linter:
      available: false
      command: ""

rules:
  proposal:
    - State intent, scope, dependencies, risks, and rollback boundaries.
    - Keep delivery compatible with a single pull request and the 10000-line review budget.
  specs:
    - Use RFC 2119 keywords for normative requirements.
    - Express acceptance scenarios with Given, When, and Then clauses.
    - Preserve byte-for-byte parity requirements and documented upstream quirks.
  design:
    - Document architecture decisions and tradeoffs with rationale.
    - Include sequence diagrams for complex runtime or parity flows.
    - Define test seams before implementation details.
  tasks:
    - Group work by phase with hierarchical numbering.
    - Keep each task independently verifiable and compatible with one pull request.
    - Pair every behavior task with its RED test and verification command.
  apply:
    tdd: true
    test_command: swift test
    guidelines:
      - Follow RED-GREEN-REFACTOR without skipping the failing-test proof.
      - Restore an executable Swift test baseline before implementing Swift behavior.
      - Follow existing code patterns and keep existing Rust parity behavior intact.
      - Do not run receipt-driven development or any review lifecycle.
  verify:
    test_command: ./bin/test && swift test
    build_command: cargo build && swift build
    coverage_threshold: 0
    guidelines:
      - Report unavailable or failing capabilities explicitly; never claim skipped checks passed.
      - Verify the implementation against proposal, specifications, design, and completed tasks.
  archive:
    - Warn before merging destructive deltas.
    - Preserve the archived change as an immutable audit trail.
